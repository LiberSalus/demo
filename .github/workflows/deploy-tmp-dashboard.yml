name: Build & Deploy — ls_tmp_dashboard

on:
  push:
    branches:
      - dev-questionnaires

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev-questionnaires
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lsinciosesionweb/package-lock.json

      - name: Install dependencies
        working-directory: lsinciosesionweb
        run: npm ci

      - name: Build project
        working-directory: lsinciosesionweb
        run: npm run build
        env:
          VITE_BASE: /ls_tmp_dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./lsinciosesionweb/dist
